<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生活待购与灵感收藏夹</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">收</span>
      <div>
        <h1>生活待购与灵感收藏夹</h1>
        <p class="tagline">先存下来，需要时再回头处理</p>
      </div>
    </div>
    <div class="search">
      <input id="search-input" type="search" placeholder="搜索链接、标题、备注或归类" autocomplete="off">
      <button id="search-clear" type="button" class="ghost" title="清除搜索">清除</button>
    </div>
  </header>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <main class="layout">
    <aside class="panel sidebar">
      <form id="add-form" class="card add-card">
        <h2>保存新链接</h2>
        <label for="url-input">网页地址</label>
        <input id="url-input" name="url" type="text" placeholder="https://example.com/item" required>
        <label for="title-input">标题（可留空）</label>
        <input id="title-input" name="title" type="text" maxlength="60" placeholder="例如：客厅置物架">
        <label for="category-select">归类</label>
        <select id="category-select" name="category_id"></select>
        <label for="note-input">备注（可留空）</label>
        <textarea id="note-input" name="note" rows="2" placeholder="价格、颜色、想到的用途…"></textarea>
        <button type="submit" class="primary">保存到收藏夹</button>
      </form>

      <section class="card">
        <div class="card-head">
          <h2>我的归类</h2>
          <span id="total-count" class="muted">0 条记录</span>
        </div>
        <ul id="category-list" class="category-list"></ul>
        <form id="category-form" class="inline-form">
          <input id="category-name" type="text" maxlength="60" placeholder="新建归类，如：运动装备">
          <button type="submit" class="small">新建</button>
        </form>
      </section>
    </aside>

    <section class="panel content">
      <div class="list-head">
        <h2 id="list-title">全部记录</h2>
        <label class="sort-toggle">
          <input id="sort-toggle" type="checkbox" checked>
          按最近保存排序
        </label>
      </div>
      <p id="list-hint" class="muted"></p>
      <ul id="bookmark-list" class="bookmark-list"></ul>
      <p id="empty-state" class="empty" hidden>这里还没有记录。把浏览时看到的链接保存进来吧。</p>
    </section>
  </main>

  <dialog id="edit-dialog" class="dialog">
    <form id="edit-form" method="dialog">
      <h2>编辑记录</h2>
      <input id="edit-id" type="hidden">
      <label for="edit-url">网页地址</label>
      <input id="edit-url" type="text" required>
      <label for="edit-title">标题</label>
      <input id="edit-title" type="text" maxlength="60">
      <label for="edit-note">备注</label>
      <textarea id="edit-note" rows="3"></textarea>
      <label for="edit-category">归类</label>
      <select id="edit-category"></select>
      <p id="edit-hint" class="muted"></p>
      <menu class="dialog-actions">
        <button type="button" id="edit-cancel" class="ghost">取消</button>
        <button type="submit" class="primary">保存修改</button>
      </menu>
    </form>
  </dialog>

  <footer class="footer">
    <span id="stats-line" class="muted"></span>
    <span class="muted">数据保存在本机，关闭页面不会丢失。</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
