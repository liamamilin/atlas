<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社区共享设施预约</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <h1>社区共享设施预约</h1>
  <div id="user-bar" class="user-bar"></div>
</header>

<main>
  <section id="login-view" class="card">
    <h2>登录</h2>
    <form id="login-form" class="grid">
      <label>用户名
        <input type="text" data-testid="login-username" autocomplete="username">
      </label>
      <label>密码
        <input type="password" data-testid="login-password" autocomplete="current-password">
      </label>
      <div class="actions">
        <button type="submit" data-testid="login-submit">登录</button>
      </div>
    </form>
  </section>

  <div id="app-view" hidden>
    <section id="admin-panel" class="card" hidden>
      <h2>设施管理</h2>
      <form id="resource-form" class="grid">
        <label>设施名称
          <input type="text" data-testid="resource-name" placeholder="例如：社区会议室">
        </label>
        <div class="actions">
          <button type="submit" data-testid="resource-save">创建设施</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>提交预约</h2>
      <form id="booking-form" class="grid">
        <label>设施
          <select data-testid="booking-resource"></select>
        </label>
        <label>开始时间（ISO8601，含时区）
          <input type="text" data-testid="booking-start" placeholder="2026-11-01T10:00:00+08:00">
        </label>
        <label>结束时间（ISO8601，含时区）
          <input type="text" data-testid="booking-end" placeholder="2026-11-01T11:00:00+08:00">
        </label>
        <label>备注
          <input type="text" data-testid="booking-note" placeholder="可选">
        </label>
        <div class="actions">
          <button type="submit" data-testid="booking-save">提交预约</button>
        </div>
      </form>
      <div id="availability" class="availability"></div>
    </section>

    <section class="card">
      <h2>预约记录</h2>
      <div id="booking-list" class="list"></div>
    </section>

    <div class="actions">
      <button type="button" id="logout-btn" data-testid="logout" class="secondary">退出登录</button>
    </div>
  </div>

  <div id="message" class="message" role="status" aria-live="polite"></div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
